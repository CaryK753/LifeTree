# LifeTree reverse proxy — single entry point for browser.
#
# Why: in cloud deployments the browser used to hit the frontend container
# directly (IP:13000). The frontend's Next.js rewrites then proxied /api/v1/*
# to the backend — but rewrites buffer SSE responses, breaking chat streaming,
# and the browser needed to know the backend's public address for direct SSE.
#
# This nginx fronts both services. The browser only talks to nginx (one origin),
# so there are no CORS issues and SSE flows through with proxy_buffering off.
#
# Traffic routing:
#   /api/v1/*  → backend:18000  (FastAPI, SSE-aware)
#   /*         → frontend:13000 (Next.js standalone)

upstream backend_upstream {
    server backend:18000;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:13000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    # ---------- API + SSE → backend ----------
    location /api/v1/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Clear Connection so keepalive to upstream works; for SSE we don't
        # want "Connection: close" truncating the stream.
        proxy_set_header Connection "";

        # SSE 关键配置：禁用缓冲，流式转发。
        # 否则 nginx 会把整个响应缓存完才发给浏览器，聊天流式输出就废了。
        proxy_buffering off;
        proxy_cache off;
        # SSE 长连接可能持续很久，给足超时。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- Frontend (Next.js) ----------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Next.js dev HMR 用 WebSocket；生产不需要但留着无害。
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Next.js streaming / SSR 流式也禁缓冲。
        proxy_buffering off;
    }
}
