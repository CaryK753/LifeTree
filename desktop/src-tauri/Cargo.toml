[package]
name = "lifetree-desktop"
version = "0.2.3"
description = "LifeTree desktop runtime host"
authors = ["wwj"]
edition = "2021"

[lib]
name = "lifetree_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.7", default-features = false, features = ["http1", "tokio", "tower-log"] }
bytes = "1"
getrandom = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt"] }
tower-http = { version = "0.5", features = ["cors"] }
url = "2"
