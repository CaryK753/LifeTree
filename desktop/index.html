<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>LifeTree</title>
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <main class="launcher">
      <header class="brand">
        <img id="brand-logo" alt="LifeTree" />
        <div>
          <h1>LifeTree</h1>
          <p data-i18n="launcher.subtitle">选择本次使用的数据服务</p>
        </div>
      </header>

      <form id="runtime-form">
        <fieldset>
          <legend data-i18n="launcher.mode.title">运行模式</legend>
          <div class="mode-list">
            <label id="local-mode-option" class="mode-option unavailable">
              <input id="local-mode" type="radio" name="mode" value="local_private" disabled />
              <span>
                <strong data-i18n="launcher.mode.local">本地服务</strong>
                <small id="local-runtime-status" data-i18n="launcher.localRuntime.detecting">正在检测本地运行时</small>
              </span>
              <span id="local-mode-badge" class="status" data-i18n="launcher.status.detecting">检测中</span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="self_hosted" />
              <span>
                <strong data-i18n="launcher.mode.selfHosted">自托管服务</strong>
                <small data-i18n="launcher.mode.selfHosted.desc">连接你的 LifeTree 部署</small>
              </span>
            </label>
            <label class="mode-option">
              <input type="radio" name="mode" value="cloud_multi_tenant" checked />
              <span>
                <strong data-i18n="launcher.mode.cloud">官方云服务（推荐）</strong>
                <small data-i18n="launcher.mode.cloud.desc">连接 LifeTree 云端租户，开箱即用</small>
              </span>
            </label>
          </div>
        </fieldset>

        <label id="service-url-field" class="field" for="service-url">
          <span data-i18n="launcher.field.serviceUrl">服务地址</span>
          <input
            id="service-url"
            name="serviceUrl"
            type="url"
            placeholder="https://lifetree.spark-ai.top"
            autocomplete="url"
            required
          />
        </label>

        <p id="error" class="error" role="alert" hidden></p>
        <button id="connect" type="submit" data-i18n="launcher.button.connect">连接</button>
      </form>

      <footer>
        <span data-i18n="launcher.footer.version" data-i18n-vars='{"version":"0.2.1"}'>桌面基础版本 0.2.1</span>
        <select id="locale-select" title="Language">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="de">Deutsch</option>
          <option value="fr">Français</option>
        </select>
      </footer>
    </main>
  </body>
</html>
