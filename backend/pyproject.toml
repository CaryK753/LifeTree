[project]
name = "lifetree-backend"
version = "0.1.0"
description = "LifeTree Phase 1 MVP backend: FastAPI + Celery + LLM orchestration"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "neo4j>=5.19",
    "redis>=5.0",
    "celery>=5.3",
    "flower>=2.0",
    "minio>=7.2",
    "httpx>=0.27",
    "instructor>=1.3",
    "openai>=1.30",
    "anthropic>=0.28",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "networkx>=3.3",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
    "python-dotenv>=1.0",
    "platformdirs>=4.2",
    "filelock>=3.15",
    "tenacity>=8.3",
    "structlog>=24.1",
    "tavily-python>=0.4",
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "webauthn>=2.0.0",
    "pywebpush>=2.0.0",
]

[project.optional-dependencies]
local = [
    "keyring>=25.2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-redis>=4.6",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
