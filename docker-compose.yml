# LifeTree full stack — infrastructure + app services.
#
# 架构：nginx 作为统一入口（默认 80 端口），浏览器只访问 nginx。
#   /api/v1/*  → backend (FastAPI, SSE 流式)
#   /*         → frontend (Next.js)
# 所有请求同源，无 CORS 问题，SSE 流式正常。
# .env 不需要配置 BACKEND_PUBLIC_URL。
#
# 访问地址：http://<服务器IP>  （或 http://<服务器IP>:${APP_PORT} 自定义端口）
#
# By default this compose file pulls pre-built images from GHCR
# (ghcr.io/caryk753/lifetree-backend, ghcr.io/caryk753/lifetree-frontend)
# so a plain `docker compose up -d` is enough — no local build required.
#
# To force a local build (e.g. for development), pass `--build`:
#
#     docker compose up -d --build
#
# Pin to a specific version by setting the image tag env vars:
#
#     BACKEND_IMAGE_TAG=0.1.0 FRONTEND_IMAGE_TAG=0.1.0 docker compose up -d

services:
  # ==================== Infrastructure ====================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lifetree-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifetree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifetree}
      POSTGRES_DB: ${POSTGRES_DB:-lifetree}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifetree}"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.20
    container_name: lifetree-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-lifetree123}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "${NEO4J_BOLT_PORT:-17687}:7687"
      - "${NEO4J_HTTP_PORT:-17474}:7474"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lifetree-redis
    command: ["redis-server", "--port", "16379"]
    ports:
      - "${REDIS_PORT:-16379}:16379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "16379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: lifetree-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lifetree}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lifetree123}
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Application ====================
  # `image:` is the default (pre-built from GHCR). `build:` is used only
  # when `--build` is passed, in which case compose builds locally and
  # tags the result with the same image name.
  backend:
    image: ghcr.io/caryk753/lifetree-backend:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: ./backend
    container_name: lifetree-backend
    ports:
      - "${APP_BACKEND_PORT:-18000}:18000"
    depends_on:
      - postgres
      - neo4j
      - redis
      - minio
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_HOST=redis
      - REDIS_PORT=16379
      - MINIO_ENDPOINT=minio:9000
    volumes:
      - backend_plugins:/app/plugins/user_uploaded
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    restart: unless-stopped

  worker:
    image: ghcr.io/caryk753/lifetree-backend:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: ./backend
    container_name: lifetree-worker
    command: celery -A app.workers.celery_app worker -l info
    depends_on:
      - backend
      - redis
      - postgres
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_HOST=redis
      - REDIS_PORT=16379
      - MINIO_ENDPOINT=minio:9000
    volumes:
      - backend_plugins:/app/plugins/user_uploaded
    # No HTTP server — disable the image's curl-based healthcheck.
    healthcheck:
      disable: true
    restart: unless-stopped

  beat:
    image: ghcr.io/caryk753/lifetree-backend:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: ./backend
    container_name: lifetree-beat
    command: celery -A app.workers.celery_app beat -l info --schedule /tmp/celerybeat-schedule
    depends_on:
      - worker
      - redis
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_HOST=redis
      - REDIS_PORT=16379
      - MINIO_ENDPOINT=minio:9000
    healthcheck:
      disable: true
    restart: unless-stopped

  flower:
    image: mher/flower:latest
    container_name: lifetree-flower
    ports:
      - "${APP_FLOWER_PORT:-15555}:15555"
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:16379/0
      - FLOWER_PORT=15555
    restart: unless-stopped

  frontend:
    image: ghcr.io/caryk753/lifetree-frontend:${FRONTEND_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        # Empty default: browser cannot reach localhost:18000 in cloud
        # deployments. SSE falls back to same-origin /api/v1/* proxy.
        # Local dev sets this via frontend/.env.local instead.
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-}
    container_name: lifetree-frontend
    # No host port — nginx fronts the frontend. Expose only if you need
    # direct access for debugging (e.g. APP_FRONTEND_PORT=13000).
    # ports:
    #   - "${APP_FRONTEND_PORT:-13000}:13000"
    expose:
      - "13000"
    depends_on:
      - backend
    environment:
      # NEXT_PUBLIC_API_BASE_URL is a build-time var (baked into the client
      # bundle). Setting it at runtime has no effect on the client, but
      # next.config.mjs rewrites read it as a fallback when BACKEND_URL is
      # absent. We leave it empty so rewrites always use BACKEND_URL.
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-}
      # Server-side only: used by next.config.mjs rewrites to proxy /api/v1/*
      # to the backend container. Uses the docker-compose service name.
      # In the nginx setup, /api/v1/* is routed directly to backend by nginx,
      # so this is only used for SSR / server-side fetches.
      - BACKEND_URL=http://backend:18000
    restart: unless-stopped

  # ==================== Reverse Proxy (Entry Point) ====================
  # nginx 统一入口：浏览器只访问 nginx，由它转发到 frontend/backend。
  # 这样所有请求同源，无 CORS 问题；SSE 走 nginx 流式转发（proxy_buffering off）。
  # 浏览器不需要知道 backend 地址，.env 也不用配 BACKEND_PUBLIC_URL。
  nginx:
    image: nginx:alpine
    container_name: lifetree-nginx
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  minio_data:
  backend_plugins:
