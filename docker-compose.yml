# LifeTree full stack — infrastructure + app services.
#
# By default this compose file pulls pre-built images from GHCR
# (ghcr.io/caryk753/lifetree-backend, ghcr.io/caryk753/lifetree-frontend)
# so a plain `docker compose up -d` is enough — no local build required.
#
# To force a local build (e.g. for development), pass `--build`:
#
#     docker compose up -d --build
#
# Pin to a specific version by setting the image tag env vars:
#
#     BACKEND_IMAGE_TAG=0.1.0 FRONTEND_IMAGE_TAG=0.1.0 docker compose up -d

services:
  # ==================== Infrastructure ====================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lifetree-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifetree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifetree}
      POSTGRES_DB: ${POSTGRES_DB:-lifetree}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifetree}"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.20
    container_name: lifetree-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-lifetree123}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    ports:
      - "${NEO4J_BOLT_PORT:-17687}:7687"
      - "${NEO4J_HTTP_PORT:-17474}:7474"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: lifetree-redis
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: lifetree-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lifetree}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-lifetree123}
    ports:
      - "${MINIO_API_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Application ====================
  # `image:` is the default (pre-built from GHCR). `build:` is used only
  # when `--build` is passed, in which case compose builds locally and
  # tags the result with the same image name.
  backend:
    image: ghcr.io/caryk753/lifetree-backend:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: ./backend
    container_name: lifetree-backend
    ports:
      - "${APP_BACKEND_PORT:-18000}:8000"
    depends_on:
      - postgres
      - neo4j
      - redis
      - minio
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
    volumes:
      - backend_plugins:/app/plugins/user_uploaded
    restart: unless-stopped

  worker:
    image: ghcr.io/caryk753/lifetree-backend:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: ./backend
    container_name: lifetree-worker
    command: celery -A app.workers.celery_app worker -l info
    depends_on:
      - backend
      - redis
      - postgres
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
    volumes:
      - backend_plugins:/app/plugins/user_uploaded
    # No HTTP server — disable the image's curl-based healthcheck.
    healthcheck:
      disable: true
    restart: unless-stopped

  beat:
    image: ghcr.io/caryk753/lifetree-backend:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: ./backend
    container_name: lifetree-beat
    command: celery -A app.workers.celery_app beat -l info
    depends_on:
      - worker
      - redis
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - NEO4J_URI=bolt://neo4j:7687
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
    healthcheck:
      disable: true
    restart: unless-stopped

  flower:
    image: mher/flower:latest
    container_name: lifetree-flower
    ports:
      - "${APP_FLOWER_PORT:-15555}:5555"
    depends_on:
      - redis
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - FLOWER_PORT=5555
    restart: unless-stopped

  frontend:
    image: ghcr.io/caryk753/lifetree-frontend:${FRONTEND_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:18000}
    container_name: lifetree-frontend
    ports:
      - "${APP_FRONTEND_PORT:-13000}:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:18000}
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  redis_data:
  minio_data:
  backend_plugins:
