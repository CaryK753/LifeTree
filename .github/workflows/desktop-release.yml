name: Build Desktop Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.2.2
        required: true
        type: string
      ref:
        description: Git ref to build from (defaults to the tag). Use a branch name like "main" to build from a branch.
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          # macos-13 (x86_64-apple-darwin) removed: GitHub is
          # deprecating macos-13 runners and they sit queued for
          # 30+ minutes, blocking the manifest job (and therefore
          # latest.json) indefinitely. Intel Mac users can use the
          # arm64 build via Rosetta. Re-add when GitHub stabilises
          # macos-14 x86_64 or macos-15 runners.
          - os: windows-2022
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Verify tag version
        shell: bash
        run: |
          VERSION="${TAG#v}"
          CONFIG_VERSION=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          test "$VERSION" = "$CONFIG_VERSION" || {
            echo "Tag $TAG does not match desktop version $CONFIG_VERSION"
            exit 1
          }

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install local runtime dependencies
        run: python -m pip install -e "backend[desktop,dev]"

      - name: Build desktop sidecar
        run: python backend/scripts/build_desktop_sidecar.py

      - name: Build signed desktop app
        working-directory: desktop
        run: |
          npx tauri build --target ${{ matrix.target }}
          # macOS post-build fixup (xattr clearing + adhoc re-signing)
          if [ "${{ runner.os }}" = "macOS" ]; then
            node scripts/post-build-fix.mjs --target ${{ matrix.target }}
          fi
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Create GitHub Release if needed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes || \
            gh release view "$TAG" >/dev/null

      - name: Upload macOS update assets
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          RELEASE_DIR="$RUNNER_TEMP/release-assets"
          mkdir -p "$RELEASE_DIR"
          DMG=$(find desktop/src-tauri/target -type f -name '*.dmg' | head -1)
          UPDATER=$(find desktop/src-tauri/target -type f -name '*.app.tar.gz' | head -1)
          test -n "$DMG" && test -n "$UPDATER" && test -f "$UPDATER.sig"
          cp "$DMG" "$RELEASE_DIR/LifeTree-${VERSION}-${{ matrix.target }}.dmg"
          cp "$UPDATER" "$RELEASE_DIR/LifeTree-${VERSION}-${{ matrix.target }}.app.tar.gz"
          cp "$UPDATER.sig" "$RELEASE_DIR/LifeTree-${VERSION}-${{ matrix.target }}.app.tar.gz.sig"
          gh release upload "$TAG" "$RELEASE_DIR"/* --clobber

      - name: Upload Windows update assets
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          RELEASE_DIR="$RUNNER_TEMP/release-assets"
          mkdir -p "$RELEASE_DIR"
          MSI=$(find desktop/src-tauri/target -type f -name '*.msi' | head -1)
          test -n "$MSI" && test -f "$MSI.sig"
          cp "$MSI" "$RELEASE_DIR/LifeTree-${VERSION}-${{ matrix.target }}.msi"
          cp "$MSI.sig" "$RELEASE_DIR/LifeTree-${VERSION}-${{ matrix.target }}.msi.sig"
          gh release upload "$TAG" "$RELEASE_DIR"/* --clobber

  manifest:
    needs: build
    # Run even if some platform builds fail or are cancelled — we only
    # need at least one sig file to produce a useful manifest. Without
    # this, a single stuck/cancelled job (e.g. macos-13 x86_64 runner
    # shortage) blocks the manifest forever and the updater endpoint
    # returns 404, breaking "Check for Updates" for all desktop users.
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download update signatures
        shell: bash
        run: |
          mkdir -p release-assets
          gh release download "$TAG" --repo "${{ github.repository }}" --dir release-assets --pattern '*.sig' || true

      - name: Publish signed update manifest
        shell: bash
        run: |
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/$TAG"
          MAC_ARM_SIG="release-assets/LifeTree-${VERSION}-aarch64-apple-darwin.app.tar.gz.sig"
          MAC_X64_SIG="release-assets/LifeTree-${VERSION}-x86_64-apple-darwin.app.tar.gz.sig"
          WINDOWS_SIG="release-assets/LifeTree-${VERSION}-x86_64-pc-windows-msvc.msi.sig"

          # Require at least the ARM macOS + Windows builds; x86_64
          # macOS is optional (macos-13 runners are being deprecated).
          test -f "$MAC_ARM_SIG" || { echo "Missing aarch64 sig"; exit 1; }
          test -f "$WINDOWS_SIG" || { echo "Missing Windows sig"; exit 1; }

          # Build the platforms object dynamically so absent platforms
          # are simply omitted instead of crashing jq with a missing
          # --rawfile argument.
          PLATFORMS='{}'
          if [ -f "$MAC_ARM_SIG" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg url "$BASE_URL/LifeTree-${VERSION}-aarch64-apple-darwin.app.tar.gz" \
              --rawfile sig "$MAC_ARM_SIG" \
              '. + {"darwin-aarch64": {signature: $sig, url: $url}}')
          fi
          if [ -f "$MAC_X64_SIG" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg url "$BASE_URL/LifeTree-${VERSION}-x86_64-apple-darwin.app.tar.gz" \
              --rawfile sig "$MAC_X64_SIG" \
              '. + {"darwin-x86_64": {signature: $sig, url: $url}}')
          fi
          if [ -f "$WINDOWS_SIG" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq --arg url "$BASE_URL/LifeTree-${VERSION}-x86_64-pc-windows-msvc.msi" \
              --rawfile sig "$WINDOWS_SIG" \
              '. + {"windows-x86_64": {signature: $sig, url: $url}}')
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg notes "LifeTree $TAG" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: $platforms}' > latest.json

          echo "Manifest contents:"
          cat latest.json
          gh release upload "$TAG" latest.json --clobber --repo "${{ github.repository }}"
